<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Calendar2</title>
    <style>
      .month-container {
        max-width: 4rem;
        text-align: center;
        
      }
      .date {
        color: blue;
        width: 1in;
      }
      td {
        border: 1px solid red;
      }
      p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <h1>Calendar2</h1>
    <div class="month-container">
      <table>
        <thead>
          <tr>
            <th id="month-header" colspan="7"></th>
          </tr>
          <tr>
            <th>S</th>
            <th>M</th>
            <th>T</th>
            <th>W</th>
            <th>T</th>
            <th>F</th>
            <th>S</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <script>
      function buildMonthTable() {
        const tableBody = document.getElementById("table-body");
        for (let row = 1; row <= 6; row++) {
          const newRow = document.createElement("tr");
          newRow.id = `row${row}`;
          for (let col = 0; col < 7; col++) {
            const newCell = document.createElement("td");
            const cellId = `cell${row}${col}`;
            newCell.id = cellId;
            newCell.textContent = cellId;
            newRow.append(newCell);
          }
          tableBody.append(newRow);
        }
      }

      function populateMonthDates() {
        const date = new Date();
        const year = date.getFullYear();
        const month = date.getMonth();
        const startDate = new Date(year, month, 1);
        
        const monthHeader = document.getElementById("month-header")
        monthHeader.textContent = date.toLocaleString('default', { month: 'long' });
        
        
        let workingDate = startDate;
        for (let row = 1; row <= 6; row++) {
          for (let cell = 0; cell < 7; cell++) {
            const currentCell = document.getElementById(`cell${row}${cell}`);
            if (month === workingDate.getMonth() && workingDate.getDay() === cell) {
              currentCell.textContent = workingDate.getDate();
              workingDate.setDate(workingDate.getDate() + 1);
            } else {
              currentCell.textContent = "";
            }
          }
        }
      }

      window.onload = function () {
        buildMonthTable();
        populateMonthDates();
      };
    </script>
  </body>
</html>
